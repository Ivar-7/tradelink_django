components:
  schemas:
    AdminUser:
      type: object
      description: Full user representation for admin use.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        username:
          type: string
          maxLength: 150
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        full_name:
          type: string
          readOnly: true
        phone_number:
          type: string
          maxLength: 20
        gender:
          enum:
          - M
          - F
          - O
          - ''
          type: string
          description: |-
            * `M` - Male
            * `F` - Female
            * `O` - Other
          x-spec-enum-id: 6088b74774d8cac4
        date_of_birth:
          type: string
          format: date
          nullable: true
        role:
          enum:
          - buyer
          - vendor
          - admin
          type: string
          description: |-
            * `buyer` - Buyer
            * `vendor` - Vendor
            * `admin` - Admin
          x-spec-enum-id: 41a2a26692843eb1
        is_active:
          type: boolean
        is_staff:
          type: boolean
        date_joined:
          type: string
          format: date-time
          readOnly: true
      required:
      - date_joined
      - email
      - full_name
      - id
      - username
    ChangePasswordRequest:
      type: object
      properties:
        current_password:
          type: string
          writeOnly: true
          minLength: 1
        new_password:
          type: string
          writeOnly: true
          minLength: 8
        new_password_confirm:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - current_password
      - new_password
      - new_password_confirm
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        username:
          type: string
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
    LoginResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/UserProfile'
        tokens:
          $ref: '#/components/schemas/LoginTokenPair'
      required:
      - tokens
      - user
    LoginTokenPair:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
      required:
      - access
      - refresh
    LogoutRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    PaginatedAdminUserList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/AdminUser'
    PaginatedProductCategoryList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/ProductCategory'
    PaginatedProductCreateUpdateList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/ProductCreateUpdate'
    PatchedAdminUserUpdateRequest:
      type: object
      properties:
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        phone_number:
          type: string
          maxLength: 20
        gender:
          enum:
          - M
          - F
          - O
          - ''
          type: string
          description: |-
            * `M` - Male
            * `F` - Female
            * `O` - Other
          x-spec-enum-id: 6088b74774d8cac4
        date_of_birth:
          type: string
          format: date
          nullable: true
        role:
          enum:
          - buyer
          - vendor
          - admin
          type: string
          description: |-
            * `buyer` - Buyer
            * `vendor` - Vendor
            * `admin` - Admin
          x-spec-enum-id: 41a2a26692843eb1
        is_active:
          type: boolean
        is_staff:
          type: boolean
    PatchedProductCategoryRequest:
      type: object
      description: Serializer for product category.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
        image_url:
          type: string
          format: uri
          maxLength: 200
    PatchedProductCreateUpdateRequest:
      type: object
      description: Serializer for creating/updating products.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        description:
          type: string
          minLength: 1
