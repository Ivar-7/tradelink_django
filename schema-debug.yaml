openapi: 3.0.3
info:
  title: Tradelink API Documentation
  version: 1.0.0
  description: Organized API docs for user website flows, catalog, admin dashboard,
    and vendor operations.
paths:
  /api/v1/auth/register/:
    post:
      operationId: v1_auth_register_create
      description: Create a new buyer or vendor account. Returns the created user
        profile and a JWT token pair.
      summary: Register a new user
      tags:
      - 1. User Website Endpoints
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
          description: ''
        '400':
          description: Validation errors
  /api/v1/auth/login/:
    post:
      operationId: v1_auth_login_create
      description: Authenticate with email and password. Returns JWT access and refresh
        tokens.
      summary: Login
      tags:
      - 1. User Website Endpoints
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
        '400':
          description: Invalid credentials or inactive account
  /api/v1/auth/logout/:
    post:
      operationId: v1_auth_logout_create
      description: Blacklist the provided refresh token, effectively terminating the
        session.
      summary: Logout
      tags:
      - 1. User Website Endpoints
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Successfully logged out
        '400':
          description: Token invalid or already expired
        '401':
          description: Authentication credentials not provided
  /api/v1/auth/token/refresh/:
    post:
      operationId: v1_auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - 1. User Website Endpoints
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/users/me/:
    get:
      operationId: v1_users_me_retrieve
      description: Returns the full profile of the currently authenticated user.
      summary: Get current user profile
      tags:
      - 1. User Website Endpoints
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
    patch:
      operationId: v1_users_me_partial_update
      description: Partially update editable profile fields (username, name, phone,
        gender, DOB).
      summary: Update current user profile
      tags:
      - 1. User Website Endpoints
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserProfileUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserProfileUpdateRequest'
          multipart/form-data:
            schema:
