      responses:
        '200':
          description: Password changed successfully
        '400':
          description: Incorrect current password or validation failure
  /api/v1/admin/users/:
    get:
      operationId: v1_admin_users_list
      description: Paginated list of all users. Supports search and role/active-status
        filtering.
      summary: '[Admin] List all users'
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
        description: 'Filter by active status: true | false'
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: role
        schema:
          type: string
        description: 'Filter by role: buyer | vendor | admin'
      - in: query
        name: search
        schema:
          type: string
        description: Search across email, username, first/last name
      tags:
      - 3. Admin Dashboard Endpoints
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminUserList'
          description: ''
  /api/v1/admin/users/{id}/:
