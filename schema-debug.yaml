  /api/v1/products/:
    post:
      operationId: v1_products_create
      description: |-
        API for managing products.

        Query params:
        - search: Search by name or description
        - category_id: Filter by category
        - min_price: Minimum price
        - max_price: Maximum price
        - in_stock: Filter to in-stock items only (true/false)
        - page: Page number
        - limit: Items per page (max 100)
      tags:
      - 1. User Website Endpoints
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreateUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProductCreateUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProductCreateUpdateRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCreateUpdate'
          description: ''
    get:
      operationId: v1_products_list
      description: Override list to include pagination info.
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - 1. User Website Endpoints
      security:
      - jwtAuth: []
      - {}
      responses:
